openapi: 3.0.3
info:
  title: Limuru Cottage Hospital Queue Management API
  description: |
    REST API for the Limuru Cottage Hospital Queue Management System.
    
    This API provides endpoints for managing patient queues, appointments,
    clinical documentation, and staff communication.
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Rate Limiting
    - Public endpoints: 30 requests/minute
    - Authenticated endpoints: 100 requests/minute
    - Auth endpoints: 5 attempts per 15 minutes
    
    ## Localization
    The API supports English (en) and Swahili (sw) via the Accept-Language header.
  version: 2.0.0
  contact:
    name: Limuru Cottage Hospital IT
    email: it-support@limuruhospital.co.ke
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-logo:
    url: https://limuruhospital.co.ke/logo.png

servers:
  - url: https://api.limuruhospital.co.ke
    description: Production server
  - url: https://api-staging.limuruhospital.co.ke
    description: Staging server
  - url: http://localhost:8787
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Staff and patient authentication endpoints
  - name: Queue
    description: Queue management operations
  - name: Patients
    description: Patient registration and management
  - name: Appointments
    description: Appointment scheduling
  - name: Departments
    description: Department configuration
  - name: Doctors
    description: Doctor management and scheduling
  - name: Clinical
    description: Clinical notes and documentation
  - name: Vitals
    description: Patient vitals recording
  - name: Messages
    description: Internal staff messaging
  - name: Voice
    description: Voice call management (WebRTC)
  - name: Notifications
    description: SMS and WhatsApp notifications
  - name: Analytics
    description: Reporting and analytics
  - name: Admin
    description: System administration
  - name: Display
    description: TV display integration
  - name: Health
    description: Health check endpoints

paths:
  # ==================== AUTHENTICATION ====================
  /api/auth/staff/login:
    post:
      tags: [Authentication]
      summary: Staff login
      description: Authenticate staff members (admin, doctor, nurse, receptionist)
      operationId: staffLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/patient/login:
    post:
      tags: [Authentication]
      summary: Patient login
      description: Authenticate patients using email, phone, or patient number
      operationId: patientLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/pin/login:
    post:
      tags: [Authentication]
      summary: Quick PIN login
      description: Quick patient access using patient ID and PIN (for kiosk)
      operationId: pinLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
      description: Terminate the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change the current user's password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== QUEUE ====================
  /api/queue:
    get:
      tags: [Queue]
      summary: Get queue status
      description: Get the current queue for all or specific departments
      operationId: getQueue
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          description: Filter by department ID
          schema:
            type: string
            format: uuid
        - name: includeCompleted
          in: query
          description: Include completed entries
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Queue data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Queue]
      summary: Create queue ticket
      description: Create a new queue ticket for a patient
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/queue/call:
    post:
      tags: [Queue]
      summary: Call patient
      description: Call a patient from the queue
      operationId: callPatient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallPatientRequest'
      responses:
        '200':
          description: Patient called
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/queue/{ticketId}/start:
    post:
      tags: [Queue]
      summary: Start consultation
      description: Mark a ticket as in progress (consultation started)
      operationId: startConsultation
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          description: Queue ticket ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Consultation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/queue/{ticketId}/complete:
    post:
      tags: [Queue]
      summary: Complete consultation
      description: Mark a ticket as completed
      operationId: completeConsultation
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          description: Queue ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTicketRequest'
      responses:
        '200':
          description: Consultation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/queue/{ticketId}/transfer:
    post:
      tags: [Queue]
      summary: Transfer patient
      description: Transfer a patient to a different department
      operationId: transferPatient
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          description: Queue ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: Patient transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/queue/{ticketId}/cancel:
    post:
      tags: [Queue]
      summary: Cancel ticket
      description: Cancel a queue ticket
      operationId: cancelTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          description: Queue ticket ID
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Cancellation reason
      responses:
        '200':
          description: Ticket cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== PATIENTS ====================
  /api/patients:
    get:
      tags: [Patients]
      summary: List patients
      description: Get a paginated list of patients
      operationId: listPatients
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          description: Search by name, email, phone, or patient number
          schema:
            type: string
      responses:
        '200':
          description: Patient list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatients'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Patients]
      summary: Register patient
      description: Register a new patient
      operationId: registerPatient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPatientRequest'
      responses:
        '201':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/patients/{patientId}:
    get:
      tags: [Patients]
      summary: Get patient details
      description: Get detailed information about a patient
      operationId: getPatient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Patients]
      summary: Update patient
      description: Update patient information
      operationId: updatePatient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/patients/{patientId}/history:
    get:
      tags: [Patients]
      summary: Get patient history
      description: Get visit history for a patient
      operationId: getPatientHistory
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          description: Patient ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientHistoryResponse'
        '404':
          description: Patient not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== APPOINTMENTS ====================
  /api/appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      description: Get appointments for a date or patient
      operationId: listAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          description: Filter by date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: patientId
          in: query
          description: Filter by patient ID
          schema:
            type: string
            format: uuid
        - name: doctorId
          in: query
          description: Filter by doctor ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [scheduled, confirmed, completed, cancelled, no_show]
      responses:
        '200':
          description: Appointment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Appointments]
      summary: Create appointment
      description: Schedule a new appointment
      operationId: createAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          description: Invalid request or slot unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/appointments/{appointmentId}:
    get:
      tags: [Appointments]
      summary: Get appointment
      description: Get appointment details
      operationId: getAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '404':
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Appointments]
      summary: Update appointment
      description: Update appointment details
      operationId: updateAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

    delete:
      tags: [Appointments]
      summary: Cancel appointment
      description: Cancel an appointment
      operationId: cancelAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/appointments/{appointmentId}/checkin:
    post:
      tags: [Appointments]
      summary: Check in for appointment
      description: Patient checks in for their appointment
      operationId: checkinAppointment
      security:
        - bearerAuth: []
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Checked in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'

  # ==================== DEPARTMENTS ====================
  /api/departments:
    get:
      tags: [Departments]
      summary: List departments
      description: Get all active departments
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
    post:
      tags: [Departments]
      summary: Create department
      description: Create a new department
      operationId: createDepartment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'

  /api/departments/{departmentId}:
    get:
      tags: [Departments]
      summary: Get department
      description: Get department details
      operationId: getDepartment
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
    put:
      tags: [Departments]
      summary: Update department
      description: Update department details
      operationId: updateDepartment
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'

  # ==================== DOCTORS ====================
  /api/doctors:
    get:
      tags: [Doctors]
      summary: List doctors
      description: Get list of doctors with their availability
      operationId: listDoctors
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: available
          in: query
          description: Filter by availability
          schema:
            type: boolean
      responses:
        '200':
          description: Doctor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorListResponse'

  /api/doctors/{doctorId}:
    get:
      tags: [Doctors]
      summary: Get doctor
      description: Get doctor details and schedule
      operationId: getDoctor
      security:
        - bearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Doctor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorResponse'

  /api/doctors/{doctorId}/availability:
    put:
      tags: [Doctors]
      summary: Toggle availability
      description: Set doctor availability status
      operationId: toggleAvailability
      security:
        - bearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAvailable:
                  type: boolean
                breakUntil:
                  type: string
                  format: date-time
                  description: Optional end time for break
      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorResponse'

  # ==================== CLINICAL NOTES ====================
  /api/notes/{queueId}:
    get:
      tags: [Clinical]
      summary: Get clinical notes
      description: Get clinical notes for a queue entry
      operationId: getClinicalNotes
      security:
        - bearerAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Clinical notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalNotesResponse'

    post:
      tags: [Clinical]
      summary: Create clinical note
      description: Add a clinical note for a queue entry
      operationId: createClinicalNote
      security:
        - bearerAuth: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinicalNoteRequest'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalNoteResponse'

  /api/notes/{noteId}:
    put:
      tags: [Clinical]
      summary: Update clinical note
      description: Update an existing clinical note
      operationId: updateClinicalNote
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicalNoteRequest'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalNoteResponse'

  # ==================== VITALS ====================
  /api/vitals/{patientId}:
    post:
      tags: [Vitals]
      summary: Record vitals
      description: Record patient vitals
      operationId: recordVitals
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordVitalsRequest'
      responses:
        '201':
          description: Vitals recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalsResponse'

    get:
      tags: [Vitals]
      summary: Get vitals history
      description: Get vitals history for a patient
      operationId: getVitalsHistory
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vitals history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VitalsHistoryResponse'

  # ==================== MESSAGES ====================
  /api/messages:
    get:
      tags: [Messages]
      summary: List messages
      description: Get messages for current user
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
