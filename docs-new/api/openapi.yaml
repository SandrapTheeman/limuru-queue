# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    # ============ Common ============
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Invalid credentials"

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    PaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    # ============ Auth ============
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: doctor@limuruhospital.co.ke
        password:
          type: string
          format: password
          minLength: 6

    PatientLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email, phone, or patient number
          example: "+254712345678"
        password:
          type: string
          format: password

    PinLoginRequest:
      type: object
      required: [patientId, pin]
      properties:
        patientId:
          type: string
          format: uuid
        pin:
          type: string
          length: 4

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            expiresIn:
              type: integer
            user:
              $ref: '#/components/schemas/User'

    PatientAuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            expiresIn:
              type: integer
            user:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                requiresPasswordChange:
                  type: boolean

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, doctor, nurse, receptionist, pharmacist, lab_tech, facility_manager, it_support]
        department:
          type: string
        room:
          type: string

    # ============ Queue ============
    QueueResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            tickets:
              type: array
              items:
                $ref: '#/components/schemas/QueueTicket'
            total:
              type: integer
            waiting:
              type: integer
            called:
              type: integer

    QueueTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketNumber:
          type: string
          example: "MED-001"
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        patientNumber:
          type: string
        department:
          type: string
        status:
          type: string
          enum: [waiting, called, in_progress, completed, cancelled, transferred]
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: "1=Normal, 2=Priority, 3=Urgent, 4=Emergency"
        position:
          type: integer
        waitTime:
          type: integer
          description: Wait time in minutes
        roomAssigned:
          type: string
        calledAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [patientId, departmentId, priority]
      properties:
        patientId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: "1=Normal, 2=Priority, 3=Urgent, 4=Emergency"
        complaint:
          type: string
          maxLength: 500
        doctorId:
          type: string
          format: uuid
        hmsAppointmentId:
          type: string

    CallPatientRequest:
      type: object
      required: [ticketId, roomAssigned]
      properties:
        ticketId:
          type: string
          format: uuid
        roomAssigned:
          type: string
        doctorId:
          type: string
          format: uuid

    CompleteTicketRequest:
      type: object
      properties:
        notes:
          type: string
        diagnosis:
          type: string
        prescription:
          type: string

    TransferRequest:
      type: object
      required: [newDepartmentId]
      properties:
        newDepartmentId:
          type: string
          format: uuid
        reason:
          type: string

    TicketResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            ticket:
              $ref: '#/components/schemas/QueueTicket'

    # ============ Patients ============
    RegisterPatientRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female, other]
        address:
          type: string
        nationalId:
          type: string
        insuranceProvider:
          type: string
        insuranceNumber:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        bloodType:
          type: string
          enum: ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-']
        allergies:
          type: string
        medicalConditions:
          type: string
        language:
          type: string
          enum: [en, sw]
          default: en

    UpdatePatientRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        address:
          type: string
        insuranceProvider:
          type: string
        insuranceNumber:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
        bloodType:
          type: string
        allergies:
          type: string
        medicalConditions:
          type: string

    PatientResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Patient'

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientNumber:
          type: string
          example: "LCH-2024-0001"
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        address:
          type: string
        nationalId:
          type: string
        insuranceProvider:
          type: string
        insuranceNumber:
          type: string
        bloodType:
          type: string
        allergies:
          type: string
        medicalConditions:
          type: string
        language:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PatientDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            patient:
              $ref: '#/components/schemas/Patient'
            stats:
              type: object
              properties:
                totalVisits:
                  type: integer
                lastVisit:
                  type: string
                  format: date

    PaginatedPatients:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Patient'
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            hasMore:
              type: boolean

    PatientHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            visits:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  ticketNumber:
                    type: string
                  department:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  completedAt:
                    type: string
                    format: date-time
                  diagnosis:
                    type: string

    # ============ Appointments ============
    CreateAppointmentRequest:
      type: object
      required: [patientId, doctorId, appointmentDate, appointmentTime]
      properties:
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          format: time
        notes:
          type: string
        hmsAppointmentId:
          type: string

    UpdateAppointmentRequest:
      type: object
      properties:
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          format: time
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled, no_show]
        notes:
          type: string

    AppointmentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Appointment'

    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        doctorId:
          type: string
          format: uuid
        doctorName:
          type: string
        departmentId:
          type: string
          format: uuid
        departmentName:
          type: string
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          format: time
        status:
          type: string
          enum: [scheduled, confirmed, completed, cancelled, no_show]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    AppointmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'

    # ============ Departments ============
    CreateDepartmentRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
          pattern: '^[A-Z]{3,10}$'
        description:
          type: string
        color:
          type: string
          example: "#FF5733"
        icon:
          type: string

    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        icon:
          type: string
        isActive:
          type: boolean

    DepartmentResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Department'

    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        icon:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DepartmentListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    # ============ Doctors ============
    DoctorResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Doctor'

    Doctor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        department:
          type: string
        room:
          type: string
