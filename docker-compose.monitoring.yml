services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hospital-queue-db
    environment:
      POSTGRES_USER: hospital_queue
      POSTGRES_PASSWORD: hospital_queue_secure_password
      POSTGRES_DB: hospital_queue
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  # API Server (Express)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hospital-queue-api
    environment:
      NODE_ENV: production
      PORT: 8787
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hospital_queue:hospital_queue_secure_password@db:5432/hospital_queue
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-password123}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital-network
    restart: unless-stopped

  # Web App (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hospital-queue-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8787
      NEXT_PUBLIC_WS_URL: ws://localhost:8787
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - hospital-network
    restart: unless-stopped

  # ============================================
  # MONITORING STACK
  # ============================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: hqs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./services/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: hqs-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning
      - ./services/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hqs_monitor_2024
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_PASSWORD_FORCE=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    networks:
      - hospital-network
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager - Alert Routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: hqs-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./services/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  hospital-network:
    driver: bridge
