name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @hospital-queue/api build

      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
          command: deploy --env staging

      - name: Set API secrets
        run: |
          echo "Setting secrets for staging..."
          cd apps/api
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env staging --name limuru-queue-api-staging
          echo "${{ secrets.DEFAULT_PASSWORD }}" | npx wrangler secret put DEFAULT_PASSWORD --env staging --name limuru-queue-api-staging
          echo "${{ secrets.TWILIO_ACCOUNT_SID }}" | npx wrangler secret put TWILIO_ACCOUNT_SID --env staging --name limuru-queue-api-staging
          echo "${{ secrets.TWILIO_AUTH_TOKEN }}" | npx wrangler secret put TWILIO_AUTH_TOKEN --env staging --name limuru-queue-api-staging

      - name: Build Web
        run: pnpm --filter @hospital-queue/web build

      - name: Deploy Web to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/out --project-name=limuru-queue --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
