name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.4.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Build API
        run: pnpm --filter @hospital-queue/api build

      - name: Set secrets
        run: |
          npx wrangler secret put JWT_SECRET --name limuru-queue-api-staging --env staging
          npx wrangler secret put DEFAULT_PASSWORD --name limuru-queue-api-staging --env staging
          npx wrangler secret put TWILIO_ACCOUNT_SID --name limuru-queue-api-staging --env staging
          npx wrangler secret put TWILIO_AUTH_TOKEN --name limuru-queue-api-staging --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}

      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
          workingDirectory: apps/api

  deploy-web:
    name: Deploy Web to Staging
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@9.4.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Build Web
        run: pnpm --filter @hospital-queue/web build
        env:
          NEXT_PUBLIC_API_URL: 'https://limuru-queue-api-staging.timnaessy-gitome.workers.dev/api'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: limuru-queue
          directory: apps/web/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
