name: Deploy Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI tests (use with caution)'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  run-ci:
    name: Run CI Tests
    runs-on: ubuntu-latest
    if: inputs.skip_tests != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @hospital-queue/api test

      - name: Test Web
        run: pnpm --filter @hospital-queue/web test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [run-ci]
    if: always() && (inputs.skip_tests == 'true' || needs.run-ci.result == 'success')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @hospital-queue/api build

      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: production
          command: deploy --env production

      - name: Set API secrets
        run: |
          echo "Setting secrets for production..."
          cd apps/api
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env production --name limuru-queue-api
          echo "${{ secrets.DEFAULT_PASSWORD }}" | npx wrangler secret put DEFAULT_PASSWORD --env production --name limuru-queue-api
          echo "${{ secrets.TWILIO_ACCOUNT_SID }}" | npx wrangler secret put TWILIO_ACCOUNT_SID --env production --name limuru-queue-api
          echo "${{ secrets.TWILIO_AUTH_TOKEN }}" | npx wrangler secret put TWILIO_AUTH_TOKEN --env production --name limuru-queue-api

      - name: Build Web
        run: pnpm --filter @hospital-queue/web build

      - name: Deploy Web to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/out --project-name=limuru-queue --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 10
          echo "Production deployment completed!"
          echo "API: https://limuru-queue-api.timnaessy-gitome.workers.dev"
          echo "Web: https://hospital-queue.pages.dev"
