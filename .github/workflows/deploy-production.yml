name: Deploy Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip CI tests (use with caution)'
        required: false
        default: false
        type: boolean

jobs:
  run-ci:
    name: Run CI Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test API
        run: npm test --workspace=@hospital-queue/api

      - name: Test Web
        run: npm test --workspace=@hospital-queue/web

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [run-ci]
    if: ${{ github.event.inputs.skip_tests == 'true' || needs.run-ci.result == 'success' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build API
        run: npm run build --workspace=@hospital-queue/api

      - name: Set secrets
        run: |
          npx wrangler secret put JWT_SECRET --name limuru-queue-api
          npx wrangler secret put DEFAULT_PASSWORD --name limuru-queue-api
          npx wrangler secret put TWILIO_ACCOUNT_SID --name limuru-queue-api
          npx wrangler secret put TWILIO_AUTH_TOKEN --name limuru-queue-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}

      - name: Deploy API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          workingDirectory: apps/api

      - name: Build Web
        run: npm run build --workspace=@hospital-queue/web
        env:
          NEXT_PUBLIC_API_URL: 'https://limuru-queue-api.timnaessy-gitome.workers.dev/api'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: limuru-queue
          directory: apps/web/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'
