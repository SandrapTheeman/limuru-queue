<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Limuru Cottage Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/glassmorphism.css">
    <style>
        :root { --sidebar-width: 250px; --header-height: 72px; }
        .app-layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: linear-gradient(180deg, rgba(13,148,136,0.08) 0%, rgba(3,7,18,0.98) 100%); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; z-index: var(--z-fixed); transition: transform 0.3s ease; }
        .sidebar-logo { display: flex; align-items: center; gap: 0.75rem; padding: 1.25rem; margin: 1rem; background: linear-gradient(135deg, var(--hospital-primary), var(--hospital-secondary)); border-radius: var(--radius-lg); text-decoration: none; }
        .sidebar-logo-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .sidebar-logo-text { font-weight: 700; font-size: 0.875rem; color: white; line-height: 1.2; }
        .sidebar-logo-sub { font-size: 0.6875rem; color: rgba(255,255,255,0.7); }
        .sidebar-nav { flex: 1; padding: 1rem 0.75rem; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500; transition: all 0.2s ease; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
        .nav-item:hover { background: rgba(13,148,136,0.15); color: white; }
        .nav-item.active { background: var(--hospital-primary); color: white; }
        .nav-item-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .sidebar-footer { padding: 1rem 0.75rem; border-top: 1px solid rgba(255,255,255,0.08); }
        .sidebar-user { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); margin-bottom: 0.75rem; }
        .sidebar-user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--hospital-primary), var(--hospital-secondary)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; color: white; }
        .sidebar-user-name { font-weight: 600; font-size: 0.875rem; color: white; }
        .sidebar-user-role { font-size: 0.6875rem; color: rgba(255,255,255,0.6); }
        .role-badge { display: inline-flex; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .role-badge.admin { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .role-badge.doctor { background: linear-gradient(135deg, #16a34a, #059669); }
        .role-badge.nurse { background: linear-gradient(135deg, #ec4899, #db2777); }
        .role-badge.receptionist { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
        .main-header { position: sticky; top: 0; height: var(--header-height); background: rgba(15,23,42,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; z-index: var(--z-sticky); }
        .header-datetime { font-size: 0.75rem; color: rgba(255,255,255,0.5); padding-right: 1rem; border-right: 1px solid rgba(255,255,255,0.1); margin-right: 0.25rem; }
        .page-content { flex: 1; padding: 1.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { padding: 1.25rem; background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-xl); transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--hospital-primary); box-shadow: 0 12px 40px rgba(13,148,136,0.15); }
        .stat-card.featured { background: linear-gradient(135deg, rgba(13,148,136,0.15) 0%, rgba(20,184,166,0.08) 100%); border-color: rgba(13,148,136,0.25); }
        .stat-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; margin-bottom: 0.75rem; }
        .stat-icon.waiting { background: rgba(13,148,136,0.2); }
        .stat-icon.called { background: rgba(59,130,246,0.2); }
        .stat-icon.completed { background: rgba(22,163,74,0.2); }
        .stat-icon.wait { background: rgba(245,158,11,0.2); }
        .stat-value { font-size: 2rem; font-weight: 700; color: white; line-height: 1; }
        .stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }
        .quick-actions { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .quick-action { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-lg); cursor: pointer; transition: all 0.2s ease; color: white; font-size: 0.875rem; font-weight: 500; }
        .quick-action:hover { background: rgba(13,148,136,0.15); border-color: var(--hospital-primary); }
        .quick-action-icon { font-size: 1.125rem; }
        .dashboard-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-xl); padding: 1.25rem; margin-bottom: 1.5rem; }
        .dashboard-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .dashboard-card-title { font-size: 1rem; font-weight: 600; color: white; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
        .data-table-wrapper { overflow-x: auto; border-radius: var(--radius-lg); background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { background: linear-gradient(135deg, rgba(13,148,136,0.12) 0%, rgba(20,184,166,0.06) 100%); color: var(--hospital-secondary); font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .data-table td { padding: 0.875rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.875rem; color: rgba(255,255,255,0.8); vertical-align: middle; }
        .data-table tbody tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
        .data-table tbody tr:hover td { background: rgba(13,148,136,0.05); }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .status-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; }
        .status-badge.waiting { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .status-badge.called { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .status-badge.in_progress { background: rgba(13,148,136,0.2); color: #14b8a6; }
        .status-badge.completed { background: rgba(22,163,74,0.2); color: #16a34a; }
        .status-badge.cancelled { background: rgba(220,38,38,0.2); color: #dc2626; }
        .action-btn { padding: 0.375rem 0.75rem; border-radius: var(--radius-md); font-size: 0.75rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s ease; }
        .action-btn.call { background: rgba(13,148,136,0.2); color: #14b8a6; }
        .action-btn.call:hover { background: rgba(13,148,136,0.3); }
        .action-btn.complete { background: rgba(22,163,74,0.2); color: #16a34a; }
        .action-btn.complete:hover { background: rgba(22,163,74,0.3); }
        .action-btn.cancel { background: rgba(220,38,38,0.2); color: #dc2626; }
        .action-btn.cancel:hover { background: rgba(220,38,38,0.3); }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%); background-size: 200% 100%; animation: skeleton-shimmer 1.5s infinite; border-radius: var(--radius-md); }
        @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-text { height: 0.875rem; margin-bottom: 0.5rem; }
        .skeleton-text.short { width: 60%; }
        .error-state { text-align: center; padding: 2rem; background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.2); border-radius: var(--radius-lg); }
        .error-state-icon { font-size: 2rem; margin-bottom: 0.75rem; }
        .error-state-title { font-size: 1rem; font-weight: 600; color: var(--hospital-danger); margin-bottom: 0.5rem; }
        .error-state-text { font-size: 0.875rem; color: rgba(255,255,255,0.6); margin-bottom: 1rem; }
        .empty-state { text-align: center; padding: 2rem; color: rgba(255,255,255,0.5); }
        .empty-state-icon { font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; }
        .empty-state-text { font-size: 0.875rem; }
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; background: rgba(15,23,42,0.95); border-radius: var(--radius-lg); box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: toast-slide-in 0.3s ease; max-width: 360px; }
        @keyframes toast-slide-in { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { border-left: 3px solid var(--hospital-success); }
        .toast.error { border-left: 3px solid var(--hospital-danger); }
        .toast-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; flex-shrink: 0; }
        .toast.success .toast-icon { background: rgba(22,163,74,0.2); color: var(--hospital-success); }
        .toast.error .toast-icon { background: rgba(220,38,38,0.2); color: var(--hospital-danger); }
        .toast-message { flex: 1; font-size: 0.875rem; color: white; }
        .mobile-menu-btn { display: none; }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; } .mobile-menu-btn { display: flex; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .stats-grid { grid-template-columns: 1fr; } .quick-actions { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="app-layout" id="appLayout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>
                <div class="sidebar-logo-text">
                    <div>Limuru Cottage</div>
                    <div class="sidebar-logo-sub">Queue Management</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <button type="button" class="nav-item active" data-section="dashboard"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span><span>Dashboard</span></button>
                <button type="button" class="nav-item" data-section="queue"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></span><span>Queue</span></button>
                <button type="button" class="nav-item" data-section="appointments"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span>Appointments</span></button>
                <button type="button" class="nav-item" data-section="messages"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span>Messages</span></button>
                <button type="button" class="nav-item" data-section="analytics"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span>Analytics</span></button>
                <button type="button" class="nav-item" data-section="doctor-notes"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span><span>Doctor Notes</span></button>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="userAvatar">SA</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="userName">Loading...</div>
                        <div class="sidebar-user-role" id="userRole">--</div>
                    </div>
                </div>
                <span class="role-badge" id="roleBadge">Admin</span>
                <button type="button" class="nav-item" id="logoutBtn"><span class="nav-item-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Logout</span></button>
            </div>
        </aside>
        <main class="main-content">
            <header class="main-header">
                <div class="flex items-center gap-4">
                    <button type="button" class="mobile-menu-btn btn btn-ghost" id="mobileMenuBtn">☰</button>
                    <div>
                        <h1 class="text-xl font-semibold" style="margin:0;">Dashboard</h1>
                        <div class="text-sm text-muted">Welcome back</div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="header-datetime" id="headerDateTime">--</span>
                    <button type="button" class="btn btn-ghost btn-sm" id="refreshBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Refresh</button>
                </div>
            </header>
            <div class="page-content">
                <div class="stats-grid stagger" id="statsGrid">
                    <div class="stat-card featured"><div class="stat-icon waiting"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-value" id="statWaiting">--</div><div class="stat-label">Patients Waiting</div></div>
                    <div class="stat-card"><div class="stat-icon called"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div><div class="stat-value" id="statCalled">--</div><div class="stat-label">Called</div></div>
                    <div class="stat-card"><div class="stat-icon completed"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="stat-value" id="statCompleted">--</div><div class="stat-label">Completed Today</div></div>
                    <div class="stat-card"><div class="stat-icon wait"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-value" id="statAvgWait">--</div><div class="stat-label">Avg Wait (min)</div></div>
                </div>
                <div class="quick-actions">
                    <button type="button" class="quick-action" data-action="call-next"><span class="quick-action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>Call Next</button>
                    <button type="button" class="quick-action" data-action="add-patient"><span class="quick-action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>Add Patient</button>
                    <button type="button" class="quick-action" data-action="new-appointment"><span class="quick-action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>New Appointment</button>
                    <button type="button" class="quick-action" data-action="send-message"><span class="quick-action-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Send Message</button>
                </div>
                <div class="dashboard-card">
                    <div class="dashboard-card-header">
                        <h2 class="dashboard-card-title"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg> Queue Management</h2>
                        <select class="form-select" id="deptFilter" style="max-width:180px;"><option value="">All Departments</option></select>
                    </div>
                    <div class="data-table-wrapper">
                        <table class="data-table">
                            <thead><tr><th>Ticket</th><th>Patient</th><th>Department</th><th>Status</th><th>Wait Time</th><th>Actions</th></tr></thead>
                            <tbody id="queueTableBody"><tr><td colspan="6"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="/js/auth.js"></script>
    <script src="/js/api-client.js"></script>
    <script>
    (function() {
        'use strict';
        if (!Auth.requireAuth()) return;
        const $ = id => document.getElementById(id);
        const user = Auth.getUser();
        let departments = [];
        function init() {
            if (user) {
                const initials = (user.name || user.email || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
                $('userAvatar').textContent = initials;
                $('userName').textContent = user.name || user.email || 'User';
                $('userRole').textContent = user.role || 'Staff';
                const roleBadge = $('roleBadge');
                roleBadge.textContent = (user.role || 'staff').toUpperCase();
                roleBadge.className = 'role-badge ' + (user.role || 'staff').toLowerCase();
            }
            updateDateTime();
            setInterval(updateDateTime, 60000);
            setupEventListeners();
            loadDashboard();
        }
        function updateDateTime() {
            const now = new Date();
            $('headerDateTime').textContent = now.toLocaleString('en-KE', { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
        }
        function setupEventListeners() {
            $('logoutBtn').addEventListener('click', () => Auth.logout());
            $('refreshBtn').addEventListener('click', loadDashboard);
            $('mobileMenuBtn').addEventListener('click', () => $('sidebar').classList.toggle('open'));
            $('deptFilter').addEventListener('change', loadQueue);
            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    showToast('info', btn.textContent.trim() + ' section');
                });
            });
            document.querySelectorAll('.quick-action').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    if (action === 'call-next') {
                        callNextPatient();
                    } else if (action === 'add-patient') {
                        window.location.href = '/patients.html?action=add';
                    } else if (action === 'new-appointment') {
                        window.location.href = '/appointments.html?action=add';
                    } else if (action === 'send-message') {
                        window.location.href = '/messages.html?action=compose';
                    } else {
                        showToast('info', action.replace('-', ' '));
                    }
                });
            });
        }
        async function loadDashboard() {
            showLoading();
            try {
                const [statsRes, queueRes, deptRes] = await Promise.all([api.queue.stats(), api.queue.list(), api.departments.list()]);
                if (statsRes.success) updateStats(statsRes.data);
                if (deptRes.success) { departments = deptRes.data || []; populateDeptFilter(); }
                if (queueRes.success) renderQueue(queueRes.data);
                else showError('queueTableBody', queueRes.error);
            } catch (err) { showToast('error', 'Failed to load dashboard'); }
        }
        async function loadQueue() {
            const deptFilter = $('deptFilter').value;
            const params = deptFilter ? { department_id: deptFilter } : {};
            const res = await api.queue.list(params);
            if (res.success) renderQueue(res.data);
            else showError('queueTableBody', res.error);
        }
        function updateStats(data) {
            $('statWaiting').textContent = data.waiting || 0;
            $('statCalled').textContent = data.called || 0;
            $('statCompleted').textContent = data.completed_today || data.completed || 0;
            $('statAvgWait').textContent = data.avg_wait_time || data.average_wait_time || '--';
        }
        function populateDeptFilter() {
            const select = $('deptFilter');
            select.innerHTML = '<option value="">All Departments</option>';
            departments.forEach(d => { select.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
        }
        function renderQueue(queue) {
            const tbody = $('queueTableBody');
            if (!queue || queue.length === 0) { tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></div><div class="empty-state-text">No patients in queue</div></div></td></tr>'; return; }
            tbody.innerHTML = queue.map(item => {
                const statusClass = (item.status || 'waiting').replace(' ', '_');
                const waitTime = item.wait_time || item.waiting_time || calculateWait(item.created_at);
                return `<tr>
                    <td><span class="font-semibold" style="color:var(--hospital-secondary)">${item.ticket_number || item.ticket || '#' + item.id}</span></td>
                    <td>${item.patient_name || item.name || 'Patient ' + item.patient_id}</td>
                    <td>${item.department_name || item.department || '--'}</td>
                    <td><span class="status-badge ${statusClass}">${item.status || 'waiting'}</span></td>
                    <td>${waitTime}</td>
                    <td>
                        ${item.status === 'waiting' ? '<button class="action-btn call" onclick="Dashboard.callPatient(' + item.id + ')">Call</button>' : ''}
                        ${item.status === 'called' ? '<button class="action-btn complete" onclick="Dashboard.completePatient(' + item.id + ')">Complete</button>' : ''}
                        ${item.status !== 'completed' && item.status !== 'cancelled' ? '<button class="action-btn cancel" onclick="Dashboard.cancelPatient(' + item.id + ')">Cancel</button>' : ''}
                    </td>
                </tr>`;
            }).join('');
        }
        function calculateWait(createdAt) {
            if (!createdAt) return '--';
            const mins = Math.floor((Date.now() - new Date(createdAt)) / 60000);
            return mins < 60 ? mins + ' min' : Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
        }
        function showLoading() { $('queueTableBody').innerHTML = '<tr><td colspan="6"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div><div class="skeleton skeleton-text"></div></td></tr>'; }
        function showError(elId, msg) { $(elId).innerHTML = '<tr><td colspan="6"><div class="error-state"><div class="error-state-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="error-state-title">Error Loading Data</div><div class="error-state-text">' + (msg || 'Please try again') + '</div><button class="btn btn-primary btn-sm" onclick="Dashboard.loadDashboard()">Retry</button></div></td></tr>'; }
        function showToast(type, message) {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = '<div class="toast-icon">' + (type === 'success' ? '✓' : '✕') + '</div><div class="toast-message">' + message + '</div>';
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'toast-slide-in 0.3s ease reverse'; setTimeout(() => toast.remove(), 300); }, 3000);
        }
        window.Dashboard = { loadDashboard, showToast };
        window.Dashboard.callNextPatient = async function() {
            const queueRes = await api.queue.list({ status: 'waiting', limit: 1 });
            if (queueRes.success && queueRes.data && queueRes.data.length > 0) {
                const nextPatient = queueRes.data[0];
                const res = await api.queue.callPatient(nextPatient.id, 'Room 1', user?.id);
                showToast(res.success ? 'success' : 'error', res.success ? 'Patient ' + (nextPatient.ticket_number || nextPatient.ticket || '#' + nextPatient.id) + ' called' : (res.error || 'Failed to call patient'));
                if (res.success) loadDashboard();
            } else {
                showToast('error', 'No patients waiting');
            }
        };
        window.Dashboard.callPatient = async function(id) {
            const res = await api.queue.callPatient(id, 'Room 1', user?.id);
            showToast(res.success ? 'success' : 'error', res.success ? 'Patient called successfully' : (res.error || 'Failed to call patient'));
            if (res.success) loadQueue();
        };
        window.Dashboard.completePatient = async function(id) {
            const res = await api.queue.complete(id);
            showToast(res.success ? 'success' : 'error', res.success ? 'Patient completed' : (res.error || 'Failed to complete'));
            if (res.success) { loadQueue(); loadDashboard(); }
        };
        window.Dashboard.cancelPatient = async function(id) {
            const res = await api.queue.update(id, { status: 'cancelled' });
            showToast(res.success ? 'success' : 'error', res.success ? 'Patient removed' : (res.error || 'Failed to cancel'));
            if (res.success) loadQueue();
        };
        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
