<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQS - API Metrics Dashboard</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --bg-card: #0f3460;
      --text-primary: #eee;
      --text-secondary: #a0a0a0;
      --accent: #e94560;
      --success: #00d26a;
      --warning: #ffc107;
      --danger: #dc3545;
      --info: #17a2b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--bg-card);
    }

    .header h1 {
      color: var(--accent);
      font-size: 1.8rem;
    }

    .header .meta {
      text-align: right;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .refresh-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .status-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }

    .status-card:hover {
      transform: translateY(-2px);
    }

    .status-card .value {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .status-card .label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-healthy { color: var(--success); }
    .status-degraded { color: var(--warning); }
    .status-unhealthy { color: var(--danger); }

    .card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--bg-secondary);
    }

    .card-title {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--bg-secondary);
    }

    th {
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    tr:hover {
      background: var(--bg-secondary);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-success { background: var(--success); color: #000; }
    .badge-warning { background: var(--warning); color: #000; }
    .badge-danger { background: var(--danger); color: #fff; }
    .badge-info { background: var(--info); color: #fff; }

    .progress-bar {
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--bg-secondary);
    }

    .metric-row:last-child {
      border-bottom: none;
    }

    .metric-name {
      color: var(--text-secondary);
    }

    .metric-value {
      font-weight: bold;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .error-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .error-item {
      padding: 10px;
      background: var(--bg-secondary);
      border-radius: 5px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .error-item .time {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .auth-warning {
      background: var(--warning);
      color: #000;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: var(--text-secondary);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading metrics dashboard...</div>
  </div>

  <script>
    // Configuration
    const API_URL = 'http://localhost:8787';
    const REFRESH_INTERVAL = 30000; // 30 seconds

    // State
    let metricsData = null;
    let healthData = null;

    // DOM helpers
    const $ = (selector) => document.querySelector(selector);

    // Fetch data
    async function fetchHealth() {
      try {
        const res = await fetch(`${API_URL}/health`);
        if (!res.ok) throw new Error('Failed to fetch health');
        return await res.json();
      } catch (err) {
        console.error('Health fetch error:', err);
        return null;
      }
    }

    async function fetchMetrics() {
      try {
        const res = await fetch(`${API_URL}/metrics`);
        if (!res.ok) throw new Error('Failed to fetch metrics');
        const text = await res.text();
        return parseMetrics(text);
      } catch (err) {
        console.error('Metrics fetch error:', err);
        return null;
      }
    }

    // Parse Prometheus metrics format
    function parseMetrics(text) {
      const metrics = {};
      const lines = text.split('\n');
      
      for (const line of lines) {
        if (line.startsWith('#') || !line.trim()) continue;
        
        const match = line.match(/^(\w+)(?:{([^}]+)})?\s+([\d.e+]+)/);
        if (match) {
          const [, name, labels, value] = match;
          if (!metrics[name]) metrics[name] = [];
          
          const parsedLabels = {};
          if (labels) {
            labels.split(',').forEach(l => {
              const [k, v] = l.split('=');
              parsedLabels[k.trim()] = v.replace(/"/g, '');
            });
          }
          
          metrics[name].push({
            value: parseFloat(value),
            labels: parsedLabels
          });
        }
      }
      
      return metrics;
    }

    // Format number
    function formatNumber(num) {
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    // Format duration
    function formatDuration(seconds) {
      if (seconds < 1) return (seconds * 1000).toFixed(0) + 'ms';
      if (seconds < 60) return seconds.toFixed(2) + 's';
      return (seconds / 60).toFixed(1) + 'm';
    }

    // Get status class
    function getStatusClass(status) {
      if (status === 'healthy') return 'status-healthy';
      if (status === 'degraded') return 'status-degraded';
      return 'status-unhealthy';
    }

    // Render dashboard
    function render() {
      const app = $('#app');
      
      let html = `
        <div class="header">
          <div>
            <h1>🏥 HQS API Metrics</h1>
            <div style="margin-top: 5px;">
              <span class="refresh-indicator"></span>
              <span style="font-size: 0.9rem; color: var(--text-secondary);">
                Auto-refresh: ${REFRESH_INTERVAL / 1000}s
              </span>
            </div>
          </div>
          <div class="meta">
            <div>Last Updated: ${new Date().toLocaleTimeString()}</div>
            <div style="margin-top: 5px;">
              <button class="btn btn-primary" onclick="refreshData()">Refresh Now</button>
            </div>
          </div>
        </div>
      `;

      // Health status
      if (healthData) {
        const healthStatus = healthData.status || 'unknown';
        const healthClass = getStatusClass(healthStatus);
        
        html += `
          <div class="status-grid">
            <div class="status-card">
              <div class="label">System Status</div>
              <div class="value ${healthClass}">${healthStatus.toUpperCase()}</div>
              <div>Uptime: ${formatDuration(healthData.uptime || 0)}</div>
            </div>
        `;

        if (healthData.checks) {
          const checks = healthData.checks;
          
          // Database
          const dbStatus = checks.database?.status || 'unknown';
          html += `
            <div class="status-card">
              <div class="label">Database</div>
              <div class="value ${getStatusClass(dbStatus === 'ok' ? 'healthy' : 'unhealthy')}">${dbStatus.toUpperCase()}</div>
              <div>Latency: ${checks.database?.latency_ms || 'N/A'}ms</div>
            </div>
          `;

          // Memory
          const memStatus = checks.memory?.status || 'unknown';
          html += `
            <div class="status-card">
              <div class="label">Memory</div>
              <div class="value">${formatNumber(checks.memory?.used_mb || 0)} MB</div>
              <div>Status: <span class="${getStatusClass(memStatus)}">${memStatus}</span></div>
            </div>
          `;

          // Connections
          html += `
            <div class="status-card">
              <div class="label">Active Connections</div>
              <div class="value">${checks.connections?.active || 0}</div>
              <div>Max: ${checks.connections?.max || 100}</div>
            </div>
          `;
        }

        html += `</div>`;
      }

      // Request metrics
      if (metricsData) {
        const totalRequests = getMetricSum('hqs_http_requests_total');
        const errorRate = calculateErrorRate();
        const avgLatency = getLatencyPercentile(0.5);
        const p95Latency = getLatencyPercentile(0.95);

        html += `
          <div class="status-grid">
            <div class="status-card">
              <div class="label">Total Requests</div>
              <div class="value">${formatNumber(totalRequests)}</div>
            </div>
            <div class="status-card">
              <div class="label">Error Rate</div>
              <div class="value ${errorRate > 1 ? 'status-degraded' : 'status-healthy'}">${errorRate.toFixed(2)}%</div>
            </div>
            <div class="status-card">
              <div class="label">Avg Latency (p50)</div>
              <div class="value">${formatDuration(avgLatency)}</div>
            </div>
            <div class="status-card">
              <div class="label">p95 Latency</div>
              <div class="value">${formatDuration(p95Latency)}</div>
            </div>
          </div>
        `;

        // Detailed metrics
        html += `
          <div class="grid-2">
            <div class="card">
              <div class="card-header">
                <span class="card-title">📊 Request Metrics</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Total HTTP Requests</span>
                <span class="metric-value">${formatNumber(totalRequests)}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Auth Attempts</span>
                <span class="metric-value">${formatNumber(getMetricSum('hqs_auth_attempts_total'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">DB Queries</span>
                <span class="metric-value">${formatNumber(getMetricSum('hqs_db_query_duration_seconds_count'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Cache Hits</span>
                <span class="metric-value">${formatNumber(getMetricSum('hqs_cache_hits_total'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Cache Misses</span>
                <span class="metric-value">${formatNumber(getMetricSum('hqs_cache_misses_total'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Notifications Sent</span>
                <span class="metric-value">${formatNumber(getMetricSum('hqs_notifications_sent_total'))}</span>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <span class="card-title">📈 Business Metrics</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Patients Registered</span>
                <span class="metric-value">${formatNumber(getBusinessEventCount('patient_registered'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Queue Entries</span>
                <span class="metric-value">${formatNumber(getBusinessEventCount('queue_created'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Queue Completed</span>
                <span class="metric-value">${formatNumber(getBusinessEventCount('queue_completed'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Doctor Notes</span>
                <span class="metric-value">${formatNumber(getBusinessEventCount('note_created'))}</span>
              </div>
              <div class="metric-row">
                <span class="metric-name">Prescriptions Issued</span>
                <span class="metric-value">${formatNumber(getBusinessEventCount('prescription_issued'))}</span>
              </div>
            </div>
          </div>
        `;

        // Top endpoints
        html += `
          <div class="card">
            <div class="card-header">
              <span class="card-title">🔝 Top Endpoints by Requests</span>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Method</th>
                  <th>Endpoint</th>
                  <th>Requests</th>
                  <th>5xx Errors</th>
                  <th>Avg Latency</th>
                </tr>
              </thead>
              <tbody>
                ${renderTopEndpoints()}
              </tbody>
            </table>
          </div>
        `;
      }

      // Fallback if no data
      if (!healthData && !metricsData) {
        html = `
          <div class="auth-warning">
            ⚠️ Unable to connect to API at ${API_URL}. 
            Please ensure the API server is running.
          </div>
          <div class="card">
            <div class="card-title">Troubleshooting</div>
            <p style="margin-top: 10px; color: var(--text-secondary);">
              1. Check if the API server is running on port 8787<br>
              2. Verify network connectivity<br>
              3. Check API logs for errors
            </p>
          </div>
        `;
      }

      app.innerHTML = html;
    }

    // Helper functions
    function getMetricSum(name) {
      if (!metricsData || !metricsData[name]) return 0;
      return metricsData[name].reduce((sum, m) => sum + m.value, 0);
    }

    function getMetricValue(name, labels = {}) {
      if (!metricsData || !metricsData[name]) return null;
      return metricsData[name].find(m => {
        return Object.entries(labels).every(([k, v]) => m.labels[k] === v);
      })?.value || 0;
    }

    function calculateErrorRate() {
      const total = getMetricSum('hqs_http_requests_total');
      const errors = metricsData?.['hqs_http_requests_total']
        ?.filter(m => m.labels.status_code?.startsWith('5'))
        ?.reduce((sum, m) => sum + m.value, 0) || 0;
      return total > 0 ? (errors / total) * 100 : 0;
    }

    function getLatencyPercentile(p) {
      const bucketName = 'hqs_http_request_duration_seconds_bucket';
      if (!metricsData || !metricsData[bucketName]) return 0;

      const buckets = metricsData[bucketName]
        .filter(m => !m.labels.le || parseFloat(m.labels.le) < 100)
        .sort((a, b) => parseFloat(a.labels.le || 0) - parseFloat(b.labels.le || 0));

      let cumSum = 0;
      const total = getMetricSum(bucketName.replace('_bucket', '_count'));

      for (const bucket of buckets) {
        cumSum += bucket.value;
        if (cumSum / total >= p) {
          return parseFloat(bucket.labels.le || 0);
        }
      }

      return 0;
    }

    function getBusinessEventCount(eventType) {
      return getMetricSum('hqs_business_events_total');
    }

    function renderTopEndpoints() {
      if (!metricsData || !metricsData['hqs_http_requests_total']) {
        return '<tr><td colspan="5">No data available</td></tr>';
      }

      const grouped = {};
      for (const m of metricsData['hqs_http_requests_total']) {
        const key = `${m.labels.method || 'GET'}:${m.labels.route || '/'}`;
        if (!grouped[key]) grouped[key] = { requests: 0, errors: 0 };
        grouped[key].requests += m.value;
        if (m.labels.status_code?.startsWith('5')) {
          grouped[key].errors += m.value;
        }
      }

      const sorted = Object.entries(grouped)
        .sort((a, b) => b[1].requests - a[1].requests)
        .slice(0, 10);

      return sorted.map(([endpoint, data]) => {
        const [method, ...path] = endpoint.split(':');
        return `
          <tr>
            <td><span class="badge badge-info">${method}</span></td>
            <td>${path.join(':')}</td>
            <td>${formatNumber(data.requests)}</td>
            <td>${data.errors > 0 ? `<span class="badge badge-danger">${data.errors}</span>` : '0'}</td>
            <td>-</td>
          </tr>
        `;
      }).join('');
    }

    // Refresh data
    async function refreshData() {
      [healthData, metricsData] = await Promise.all([
        fetchHealth(),
        fetchMetrics()
      ]);
      render();
    }

    // Initialize
    async function init() {
      await refreshData();
      setInterval(refreshData, REFRESH_INTERVAL);
    }

    init();
  </script>
</body>
</html>
