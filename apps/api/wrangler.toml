name = "limuru-queue-api"
main = "src/index.ts"
compatibility_date = "2024-10-22"
node_compat = true
usage_model = "bundled"

# Secrets (set via: wrangler secret put <name>)
# Required secrets:
# - JWT_SECRET
# - DEFAULT_PASSWORD
# Optional secrets:
# - TWILIO_ACCOUNT_SID
# - TWILIO_AUTH_TOKEN
# - TWILIO_PHONE_NUMBER
# - WHATSAPP_API_TOKEN
# - WHATSAPP_PHONE_NUMBER
# - OPENROUTER_API_KEY

[vars]
ENVIRONMENT = "development"
API_VERSION = "v2"
JWT_SECRET = "CHANGE_ME_IN_PRODUCTION"
DEFAULT_PASSWORD = "#Limuru_Cottage_Hospital@2026"
AI_PROVIDER = "ollama"
HMS_ADAPTER_TYPE = "mock"

# ===========================================
# D1 Database
# ===========================================
# Create with: wrangler d1 create limuru-queue-db
# Apply migrations: wrangler d1 migrations apply limuru-queue-db
[[d1_databases]]
binding = "DB"
database_name = "limuru-queue-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "src/db/migrations"

# ===========================================
# KV Namespaces
# ===========================================
# Create with: wrangler kv:namespace create limuru-queue-kv
[[kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_SESSION_KV_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_CACHE_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

# ===========================================
# R2 Storage
# ===========================================
# Create with: wrangler r2 bucket create limuru-queue-storage
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "limuru-queue-storage"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "limuru-queue-storage"

# ===========================================
# Durable Objects for Real-time Features
# ===========================================
[[durable_objects.bindings]]
name = "QUEUE_ROOM"
class_name = "QueueRoomDO"

[[durable_objects.bindings]]
name = "PATIENT_SYNC"
class_name = "PatientSyncDO"

# ===========================================
# Environments
# ===========================================
[env.staging]
name = "limuru-queue-api-staging"
vars = { ENVIRONMENT = "staging" }

[env.production]
name = "limuru-queue-api"
vars = { ENVIRONMENT = "production" }
# route = "api.limuruhospital.co.ke/*"
