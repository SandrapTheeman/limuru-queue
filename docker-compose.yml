services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hospital-queue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hospital-queue-db
    environment:
      POSTGRES_USER: hospital_queue
      POSTGRES_PASSWORD: hospital_queue_secure_password
      POSTGRES_DB: hospital_queue
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_queue"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  # API Server (Express)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hospital-queue-api
    environment:
      NODE_ENV: production
      PORT: 8787
      LOG_LEVEL: info
      DATABASE_URL: postgresql://hospital_queue:hospital_queue_secure_password@db:5432/hospital_queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-password123}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospital-network
    restart: unless-stopped

  # Web App (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hospital-queue-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8787
      NEXT_PUBLIC_WS_URL: ws://localhost:8787
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - hospital-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  hospital-network:
    driver: bridge
